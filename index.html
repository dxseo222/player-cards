<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Player Cards</title>
  <meta name="description" content="Make a player card from your Discord messages and trade cards with friends.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Grenze+Gotisch:wght@500;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Cinzel:wght@700&family=Permanent+Marker&family=Press+Start+2P&family=Bungee&family=Pacifico&display=swap">
  <link rel="stylesheet" href="css/card.css?v10">
  <link rel="stylesheet" href="css/app.css?v10">
</head>
<body>
  <header class="bar">
    <a class="logo" href="#card">Player Cards</a>
    <nav class="tabs" id="tabs" hidden>
      <a href="#card" data-tab="card">My card</a>
      <a href="#collection" data-tab="collection">Collection</a>
      <a href="#players" data-tab="players">Players</a>
      <a href="#trades" data-tab="trades">Trades <span class="badge" id="tradeBadge" hidden></span></a>
      <a href="#leaderboard" data-tab="leaderboard">Leaderboard</a>
      <a href="#admin" data-tab="admin" id="adminTab" hidden>Moderation</a>
    </nav>
    <div class="who" id="who"></div>
  </header>

  <div class="demo" id="demoBanner" hidden>
    <b>Demo mode.</b> Everything is saved in this browser only. Switch between sample players at the top right to test trades.
    Add your Supabase keys to <code>config.js</code> to go live.
  </div>

  <main id="view" class="view"></main>

  <div class="modal" id="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button type="button" class="btn ghost" id="modalClose" aria-label="Close">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js?v10"></script>
</body>
</html>
