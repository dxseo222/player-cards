# Weekly encrypted backup of the database (every table, rule and function in the public schema:
# cards, versions, items, trades, wishlists, reports, profiles).
#
# The repo is public, so the backup is encrypted with your own passphrase before it's stored as
# a workflow artifact. Without the passphrase the file is useless to anyone who downloads it.
# Artifacts are kept for 90 days, so you always have the last ~12 weeks.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     the Session pooler connection string from Supabase → Connect,
#                       with your database password filled in
#   BACKUP_PASSPHRASE   any long passphrase you keep somewhere safe (a password manager)
#
# Not included: login accounts (Supabase keeps those) and portrait image files (Storage).
# How to restore: see README.md → Backups.
name: Backup

on:
  schedule:
    - cron: "41 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the secrets are set
        id: check
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASS" ]; then
            echo "::warning::Backups are not set up yet: add SUPABASE_DB_URL and BACKUP_PASSPHRASE as repository secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pg_dump 17
        if: steps.check.outputs.ready == 'true'
        run: |
          sudo apt-get install -y -qq postgresql-common > /dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y -qq postgresql-client-17 > /dev/null
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump and encrypt
        if: steps.check.outputs.ready == 'true'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y-%m-%d)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" --schema=public --no-owner --no-privileges --format=custom --file=backup.dump
          ls -la backup.dump
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output "player-cards-$STAMP.dump.gpg" backup.dump <<< "$PASS"
          shred -u backup.dump

      - name: Store the encrypted backup
        if: steps.check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: player-cards-backup-${{ env.STAMP }}
          path: player-cards-*.dump.gpg
          retention-days: 90
          if-no-files-found: error
