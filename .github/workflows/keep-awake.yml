# Free Supabase projects pause after about a week without any activity.
# This makes one small read every three days so the site never goes to sleep.
# It reads the public URL and publishable key from config.js (both are safe to publish).
# Note: GitHub turns off scheduled workflows after 60 days with no commits to the repo;
# if that happens, re-enable it under the repo's Actions tab.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping the database
        run: |
          URL=$(sed -n "s/.*SUPABASE_URL = '\(.*\)';.*/\1/p" config.js)
          KEY=$(sed -n "s/.*SUPABASE_ANON_KEY = '\(.*\)';.*/\1/p" config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "config.js has no Supabase values; nothing to ping"; exit 0; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/cards?select=id&limit=1" -H "apikey: $KEY")
          echo "Supabase answered HTTP $code"
          test "$code" = "200"
