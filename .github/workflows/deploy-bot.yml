# Deploys the Discord bot (supabase/functions/discord-bot) to Supabase whenever its code changes.
# Needs the SUPABASE_ACCESS_TOKEN repository secret (README → Discord bot). Without it, this
# job skips itself instead of failing.
name: Deploy Discord bot

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-bot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-bot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::Add the SUPABASE_ACCESS_TOKEN secret to deploy the Discord bot."
            exit 0
          fi
          npx --yes supabase@3.2.0 functions deploy discord-bot --remote=xqinypchsnkoiezpvqyn --no-verify-jwt --use-api --yes
